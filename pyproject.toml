[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-history"
version = "0.2.0"
description = "Query Home Assistant history and calculate entity statistics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ha-history = "ha_history.__main__:main"

[tool.setuptools]
packages = ["ha_history"]
